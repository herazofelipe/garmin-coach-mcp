# One-click deploy to Render (free plan). Each person deploys THEIR OWN copy with THEIR OWN
# Garmin account. Nothing secret lives in this repo: Render asks for the values marked
# `sync: false` and generates MCP_SECRET automatically.
services:
  - type: web
    name: garmin-mcp
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: GARMIN_EMAIL            # Garmin Connect email (account without MFA)
        sync: false
      - key: GARMIN_PASSWORD         # Garmin Connect password
        sync: false
      - key: GARMIN_TOKENS           # optional: from garmin_login.py (needed if your account uses MFA)
        sync: false
      - key: MCP_SECRET              # generated by Render; it is the secret part of your connector URL
        generateValue: true
      - key: LOCAL_TZ_OFFSET_HOURS   # your offset from UTC, e.g. -5 Bogotá, -6 Mexico City, 1 Madrid
        value: "0"
