name: tests

# Runs on every push and pull request. If you set Render to deploy only
# after checks pass, a failing test blocks the deploy.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions pinned to an exact commit (not a movable tag).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies (hash-verified packages only)
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install --require-hashes -r requirements-dev.txt
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements.txt --require-hashes --progress-spinner off
      - name: Tests (security and behaviour)
        run: python -m pytest -q tests
